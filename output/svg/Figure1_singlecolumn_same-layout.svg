<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 414" role="img" aria-labelledby="title desc">
  <title id="title">ActDelta system architecture</title>
  <desc id="desc">Robot-side agent-view scheduling, edge execution, always-current wrist view and proprioception, and executed-action feedback.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 3 L0 6 Z" fill="#656A6E"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 3 L0 6 Z" fill="#587A9B"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 3 L0 6 Z" fill="#718E63"/></marker>
    <style>
      .serif{font-family:'Times New Roman',Times,serif;fill:#111315;font-weight:600}
      .body{font-size:20px}.small{font-size:17px}.tiny{font-size:15px}.math{font-style:italic}
      .formula{font-family:'Cambria Math','Cambria','Times New Roman',serif}
      .line{fill:none;stroke:#586067;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#586067;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect x="0" y="0" width="1024" height="414" fill="#FFFFFF"/>

  <!-- Robot scenario -->
  <g id="robot-scenario">
    <rect x="109" y="244" width="121" height="18" fill="#BDA78A" stroke="#4F565C" stroke-width="1.8"/>
    <line x1="125" y1="262" x2="125" y2="326" class="line"/><line x1="213" y1="262" x2="213" y2="326" class="line"/>
    <rect x="127" y="257" width="18" height="17" fill="#A7C4A1" stroke="#4F565C"/><rect x="151" y="244" width="19" height="23" fill="#D59A83" stroke="#4F565C"/><rect x="175" y="255" width="21" height="19" fill="#8FAAC1" stroke="#4F565C"/>
    <rect x="34" y="276" width="60" height="24" rx="7" fill="#7F8E99" stroke="#444B51" stroke-width="2"/>
    <circle cx="68" cy="260" r="18" fill="#96A3AD" stroke="#444B51" stroke-width="2.2"/><circle cx="68" cy="260" r="7" fill="#D9DBDE" stroke="#444B51"/>
    <path d="M68 242 L87 195 L130 222" fill="none" stroke="#9DAAB3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68 242 L87 195 L130 222" fill="none" stroke="#444B51" stroke-width="2.2"/>
    <circle cx="87" cy="195" r="10" fill="#AEB8BF" stroke="#444B51" stroke-width="2"/><circle cx="130" cy="222" r="9" fill="#AEB8BF" stroke="#444B51" stroke-width="2"/>
    <path d="M130 222 L147 239" stroke="#8999A5" stroke-width="12" stroke-linecap="round"/><path d="M130 222 L147 239" stroke="#444B51" stroke-width="2"/>
    <path d="M144 236 L155 230 M145 238 L155 244" stroke="#444B51" stroke-width="3"/>
    <text class="serif body" x="102" y="342" text-anchor="middle">Robot</text><text class="serif body" x="102" y="365" text-anchor="middle">scenario</text>
  </g>

  <!-- Agent-view input -->
  <g id="agent-view-camera">
    <text class="serif body" x="111" y="70" text-anchor="middle">Agent-view</text><text class="serif body" x="111" y="94" text-anchor="middle">camera</text><text class="serif body" x="111" y="118" text-anchor="middle">(scheduled)</text>
    <rect x="100" y="130" width="33" height="22" rx="4" fill="#D9DBDE" stroke="#30363B" stroke-width="2"/><path d="M133 135 L143 131 V151 L133 147 Z" fill="#B6BABD" stroke="#30363B" stroke-width="2"/>
    <line x1="145" y1="141" x2="208" y2="141" stroke="#587A9B" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Robot-side scheduling -->
  <g id="robot-side-scheduling">
    <rect x="208" y="70" width="677" height="101" rx="4" fill="#E8EDF3" stroke="#587A9B" stroke-width="1.8" stroke-dasharray="9 7"/>
    <text class="serif body" x="546" y="61" text-anchor="middle">Robot-side scheduling</text>

    <rect x="224" y="86" width="113" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="280" y="119" text-anchor="middle">Encoder</text><text class="serif body math" x="280" y="144" text-anchor="middle">zₜ</text>
    <line x1="337" y1="121" x2="362" y2="121" class="line" marker-end="url(#arrow-gray)"/>

    <rect x="365" y="86" width="165" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="447" y="113" text-anchor="middle">World model</text>
    <text class="serif body math" x="447" y="141" text-anchor="middle">zₜ</text>
    <path d="M440 128 L447 124 L454 128" fill="none" stroke="#151718" stroke-width="1.3"/>
    <line x1="530" y1="121" x2="557" y2="121" class="line" marker-end="url(#arrow-gray)"/>

    <rect x="560" y="86" width="130" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="625" y="112" text-anchor="middle">Relevance</text><text class="serif body" x="625" y="137" text-anchor="middle">head Φ</text>
    <line x1="690" y1="121" x2="717" y2="121" class="line" marker-end="url(#arrow-gray)"/>

    <rect x="720" y="86" width="151" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="795" y="112" text-anchor="middle">Budget gate</text><text class="serif body math" x="795" y="139" text-anchor="middle">τᵦ</text>
  </g>

  <!-- Predicted/real agent-view choice -->
  <g id="agent-view-refresh-choice">
    <text class="serif body" x="385" y="199" text-anchor="middle">Real agent-</text><text class="serif body" x="385" y="220" text-anchor="middle">view frame —</text><text class="serif body" x="385" y="241" text-anchor="middle">upload and reset</text>
    <text class="serif body" x="530" y="199" text-anchor="middle">Predicted</text><text class="serif body" x="530" y="220" text-anchor="middle">roll forward</text>
    <path d="M447 236 V156" fill="none" stroke="#8A8E91" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
    <path d="M490 237 V199 H574" fill="none" stroke="#8A8E91" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
    <line x1="489" y1="241" x2="573" y2="241" stroke="#587A9B" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
    <g id="switch">
      <rect x="574" y="229" width="51" height="50" fill="#F6F7F7" stroke="#575D62" stroke-width="1.6"/>
      <circle cx="591" cy="242" r="4" fill="#30363B"/><circle cx="591" cy="268" r="4" fill="#30363B"/>
      <circle cx="613" cy="254" r="4" fill="#FFFFFF" stroke="#30363B" stroke-width="1.4"/><line x1="591" y1="242" x2="610" y2="253" stroke="#30363B" stroke-width="2"/>
    </g>
    <text class="serif body math" x="617" y="218">uₜ = 1</text><text class="serif body math" x="495" y="291">uₜ = 0</text>
  </g>

  <!-- Always-current inputs -->
  <g id="always-current-inputs">
    <rect x="244" y="264" width="31" height="23" rx="4" fill="#D9DBDE" stroke="#30363B" stroke-width="2"/><path d="M275 269 L285 265 V285 L275 281 Z" fill="#B6BABD" stroke="#30363B" stroke-width="2"/>
    <text class="serif body" x="294" y="279">Wrist-view camera</text><text class="serif body" x="294" y="301">(always current)</text>
    <path d="M247 325 q10 -15 20 0 M242 330 q15 -24 30 0 M237 335 q20 -33 40 0" fill="none" stroke="#3E4449" stroke-width="2"/><circle cx="257" cy="336" r="3" fill="#3E4449"/>
    <text class="serif body" x="294" y="339">Proprioception</text><text class="serif body" x="294" y="361">(always current)</text>
    <line x1="450" y1="275" x2="668" y2="275" stroke="#656A6E" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
    <line x1="450" y1="323" x2="668" y2="323" stroke="#656A6E" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- Edge execution -->
  <g id="edge-execution">
    <rect x="650" y="241" width="357" height="102" rx="4" fill="#FAFAF9" stroke="#8B8F92" stroke-width="1.7" stroke-dasharray="8 7"/>
    <text class="serif body" x="833" y="232" text-anchor="middle" fill="#555A5E">Edge execution</text>
    <line x1="625" y1="254" x2="667" y2="276" stroke="#587A9B" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
    <rect x="668" y="255" width="135" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="735" y="285" text-anchor="middle">Frozen</text><text class="serif body" x="735" y="312" text-anchor="middle">policy π₀.₅</text>
    <line x1="803" y1="290" x2="829" y2="290" class="line" marker-end="url(#arrow-gray)"/>
    <rect x="832" y="255" width="160" height="70" rx="8" fill="#F4F5F6" stroke="#6D747A" stroke-width="1.5"/>
    <text class="serif body" x="912" y="282" text-anchor="middle">Action chunk</text>
    <g id="action-chunk-formula" class="serif formula">
      <text x="854" y="312" font-size="21" font-style="italic">A</text>
      <text x="869" y="318" font-size="13" font-style="italic">t</text>
      <text x="884" y="312" font-size="21">&#8712;</text>
      <text x="906" y="312" font-size="21">&#8477;</text>
      <text x="924" y="298" font-size="13">10×7</text>
    </g>
  </g>

  <!-- Closed-loop feedback and downlink -->
  <g id="closed-loop-feedback">
    <path d="M796 156 V197 H625" fill="none" stroke="#656A6E" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <path d="M925 255 V34 H430 V82" fill="none" stroke="#718E63" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
    <text class="serif body" x="676" y="24" text-anchor="middle">aₜ₋₁ executed feedback</text>
    <path d="M925 325 V397 H107" fill="none" stroke="#718E63" stroke-width="2.4" marker-end="url(#arrow-green)"/>
    <text class="serif body" x="500" y="392" text-anchor="middle">Action downlink</text>
    <text class="serif body" x="775" y="392">Executed-action feedback aₜ₋₁</text>
  </g>
</svg>
